<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23141414'/%3E%3Crect x='26' y='22' width='16' height='56' fill='%239ef500'/%3E%3Cpath d='M42 22h20a17 17 0 0 1 0 34H42V42h18a3 3 0 0 0 0-6H42z' fill='%239ef500'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PayPilot: a multi-agent payments operations console for payments, refunds, reconciliation and fraud checks." />
  <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint so there is no light/dark flash.
    try {
      var t = localStorage.getItem("paypilot-theme");
      if (t !== "light" && t !== "dark" && t !== "system") t = "dark";
      if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (t === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <title>PayPilot · Payments Ops Console</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
