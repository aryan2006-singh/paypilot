services:
  # Single all-in-one service: the Docker build compiles the React frontend and
  # serves it from the same FastAPI process as the API, so there is no CORS
  # setup and no second deploy to keep in sync.
  #
  # Docker (not `runtime: python`) because the build needs Node to produce
  # frontend/dist — that directory is a gitignored build artifact, and a
  # Python-only build would leave it missing.
  - type: web
    name: paypilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Only needed if you later deploy the frontend separately (e.g. Vercel)
      # and point it at this API — comma-separated origins. Unset is correct
      # for the all-in-one setup above.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: without real Razorpay test keys every tool call returns
      # deterministic mock data, so the app is fully functional unset.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
