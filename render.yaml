services:
  # Single all-in-one service: the Docker build compiles the React frontend and
  # serves it from the same FastAPI process as the API, so there is no CORS
  # setup and no second deploy to keep in sync.
  - type: web
    name: paypilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Render's edge is a proxy: trust X-Forwarded-For so rate limits are per client.
      - key: TRUST_PROXY_HEADERS
        value: "1"
      # Comma-separated API keys. Unset = the API is open to anyone with the URL.
      - key: PAYPILOT_API_KEYS
        sync: false
      # Claude writes the answers when this is set; template replies otherwise.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Razorpay keys switch from demo data to real data.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Only needed if the frontend is deployed on another origin.
      - key: ALLOWED_ORIGINS
        sync: false
    # The free plan has no persistent disk, so conversations reset on each
    # deploy/restart. On a paid plan, attach a disk and point DATABASE_PATH at it:
    # disk:
    #   name: paypilot-data
    #   mountPath: /app/data
    #   sizeGB: 1
