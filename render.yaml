services:
  - type: web
    name: paypilot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m rag.build_index
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set this once the Vercel frontend URL is known, e.g.
      # https://paypilot.vercel.app (comma-separate multiple origins).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
